version: "2"
sql:
  - engine: "postgresql"
    schema: "../migrations"
    queries: "queries.sql"
    gen:
      go:
        package: "db"
        out: "../internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - go_type:
              import: "github.com/google/uuid"
              type: "UUID"
            db_type: "pg_catalog.uuid"
