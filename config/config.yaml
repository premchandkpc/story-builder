# Story Builder Configuration
# See config.development.yaml for local dev overrides.

server:
  http_port: 8080
  grpc_port: 9090
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s

database:
  url: "postgres://storybuilder:storybuilder@localhost:5432/storybuilder?sslmode=disable"
  max_conns: 10
  min_conns: 2

river:
  queues:
    generate:
      max_workers: 2
    extract:
      max_workers: 4
    merge:
      max_workers: 2
    validate:
      max_workers: 1

llm:
  # One of "anthropic" or "ollama"
  provider: ollama
  anthropic:
    api_key: ""
    model: claude-sonnet-4-20250514
  ollama:
    url: "http://localhost:11434"
    model: llama3.2
