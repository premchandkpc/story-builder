syntax = "proto3";

package storybuilder.v1;

option go_package = "github.com/premchand/story-builder/internal/grpc/gen/storybuilder/v1;storybuilderv1";

import "storybuilder/v1/common.proto";

message StorySummary {
  UUID id = 1;
  UUID story_id = 2;
  optional UUID node_id = 3;
  string level = 4; // "scene", "act", "story"
  string content = 5;
  int32 word_count = 6;
  Timestamp created_at = 7;
}

message GetSceneSummaryRequest {
  UUID story_id = 1;
  UUID node_id = 2;
}

message GetSummaryByLevelRequest {
  UUID story_id = 1;
  string level = 2;
}

message CountSummariesByLevelRequest {
  UUID story_id = 1;
  string level = 2;
}

message CountSummariesByLevelResponse {
  int32 count = 1;
}

message ShouldElevateRequest {
  UUID story_id = 1;
  string level = 2;
  int32 threshold = 3;
}

message ShouldElevateResponse {
  bool should_elevate = 1;
  string level = 2;
  int32 threshold = 3;
}

service SummaryService {
  rpc GetSceneSummary(GetSceneSummaryRequest) returns (StorySummary);
  rpc GetSummaryByLevel(GetSummaryByLevelRequest) returns (StorySummary);
  rpc CountSummariesByLevel(CountSummariesByLevelRequest) returns (CountSummariesByLevelResponse);
  rpc ShouldElevate(ShouldElevateRequest) returns (ShouldElevateResponse);
}
