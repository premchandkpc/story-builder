syntax = "proto3";

package storybuilder.v1;

option go_package = "github.com/premchand/story-builder/internal/grpc/gen/storybuilder/v1;storybuilderv1";

import "storybuilder/v1/common.proto";

// ── Character ──────────────────────────────────────────────────

message Character {
  UUID id = 1;
  int32 version = 2;
  string name = 3;
  string persona = 4;
  string backstory = 5;
  string moral_alignment = 6;
  repeated string personality = 7;
  repeated string flaws = 8;
  repeated string goals = 9;
  repeated string traits = 10;
  repeated string voice_samples = 11;
  map<string, string> relationships = 12;
  optional UUID parent_id = 13;
  Timestamp created_at = 14;
}

message CreateCharacterRequest {
  string name = 1;
  string persona = 2;
  string backstory = 3;
  string moral_alignment = 4;
  repeated string personality = 5;
  repeated string flaws = 6;
  repeated string goals = 7;
  repeated string traits = 8;
  repeated string voice_samples = 9;
  optional UUID parent_id = 10;
  map<string, string> relationships = 11;
}

message GetCharacterRequest {
  UUID id = 1;
  int32 version = 2; // 0 = latest
}

message UpdateCharacterRequest {
  UUID id = 1;
  string name = 2;
  string persona = 3;
  string backstory = 4;
  string moral_alignment = 5;
  repeated string personality = 6;
  repeated string flaws = 7;
  repeated string goals = 8;
  repeated string traits = 9;
  repeated string voice_samples = 10;
  optional UUID parent_id = 11;
  map<string, string> relationships = 12;
}

message ListCharactersResponse {
  repeated Character characters = 1;
}

// ── Actor ──────────────────────────────────────────────────────

message Actor {
  UUID id = 1;
  string name = 2;
  string gender = 3;
  string ethnicity = 4;
  string race = 5;
  string skin_tone = 6;
  string eye_color = 7;
  string hair_color = 8;
  string hair_style = 9;
  string build = 10;
  int32 height_cm = 11;
  int32 weight_kg = 12;
  int32 age = 13;
  string nationality = 14;
  map<string, string> traits = 15;
  Timestamp created_at = 16;
}

message CreateActorRequest {
  string name = 1;
  string gender = 2;
  string ethnicity = 3;
  string race = 4;
  string skin_tone = 5;
  string eye_color = 6;
  string hair_color = 7;
  string hair_style = 8;
  string build = 9;
  int32 height_cm = 10;
  int32 weight_kg = 11;
  int32 age = 12;
  string nationality = 13;
  map<string, string> traits = 14;
}

message GetActorRequest {
  UUID id = 1;
}

message UpdateActorRequest {
  UUID id = 1;
  string name = 2;
  string gender = 3;
  string ethnicity = 4;
  string race = 5;
  string skin_tone = 6;
  string eye_color = 7;
  string hair_color = 8;
  string hair_style = 9;
  string build = 10;
  int32 height_cm = 11;
  int32 weight_kg = 12;
  int32 age = 13;
  string nationality = 14;
  map<string, string> traits = 15;
}

message ListActorsResponse {
  repeated Actor actors = 1;
}

// ── Character Trait ────────────────────────────────────────────

message CharacterTrait {
  UUID id = 1;
  string name = 2;
  string category = 3;
  string description = 4;
  Timestamp created_at = 5;
}

message CreateCharacterTraitRequest {
  string name = 1;
  string category = 2;
  string description = 3;
}

message GetCharacterTraitRequest {
  UUID id = 1;
}

message ListCharacterTraitsResponse {
  repeated CharacterTrait traits = 1;
}

message TraitAssignment {
  UUID character_id = 1;
  UUID trait_id = 2;
  int32 intensity = 3;
  string note = 4;
}

message AssignTraitRequest {
  UUID character_id = 1;
  UUID trait_id = 2;
  int32 intensity = 3;
  string note = 4;
}

message UnassignTraitRequest {
  UUID character_id = 1;
  UUID trait_id = 2;
}

message GetTraitAssignmentsRequest {
  UUID character_id = 1;
}

message GetTraitAssignmentsResponse {
  repeated TraitAssignment assignments = 1;
}

// ── Casting ────────────────────────────────────────────────────

message Casting {
  UUID id = 1;
  UUID story_id = 2;
  UUID actor_id = 3;
  UUID character_id = 4;
  string role_type = 5;
  Timestamp created_at = 6;
}

message CreateCastingRequest {
  UUID story_id = 1;
  UUID actor_id = 2;
  UUID character_id = 3;
  string role_type = 4;
}

message ListCastingForStoryRequest {
  UUID story_id = 1;
}

message ListCastingForActorRequest {
  UUID actor_id = 1;
}

message ListCastingForCharacterRequest {
  UUID character_id = 1;
}

message ListCastingResponse {
  repeated Casting castings = 1;
}

// ── Location ───────────────────────────────────────────────────

message Location {
  UUID id = 1;
  int32 version = 2;
  string name = 3;
  string description = 4;
  repeated string props = 5;
  Timestamp created_at = 6;
}

message CreateLocationRequest {
  string name = 1;
  string description = 2;
  repeated string props = 3;
}

message GetLocationRequest {
  UUID id = 1;
  int32 version = 2; // 0 = latest
}

message UpdateLocationRequest {
  UUID id = 1;
  string description = 2;
  repeated string props = 3;
}

message ListLocationsResponse {
  repeated Location locations = 1;
}

// ── Lore ───────────────────────────────────────────────────────

message Lore {
  UUID id = 1;
  repeated string tags = 2;
  string content = 3;
  repeated float embedding = 4;
  Timestamp created_at = 5;
}

message CreateLoreRequest {
  repeated string tags = 1;
  string content = 2;
}

message SearchLoreByTagsRequest {
  repeated string tags = 1;
}

message SearchLoreSimilarRequest {
  repeated float embedding = 1;
  int32 limit = 2;
}

message ListLoreResponse {
  repeated Lore lore = 1;
}

// ── Services ───────────────────────────────────────────────────

service CharacterService {
  rpc CreateCharacter(CreateCharacterRequest) returns (Character);
  rpc GetCharacter(GetCharacterRequest) returns (Character);
  rpc UpdateCharacter(UpdateCharacterRequest) returns (Character);
  rpc ListCharacters(Empty) returns (ListCharactersResponse);
}

service ActorService {
  rpc CreateActor(CreateActorRequest) returns (Actor);
  rpc GetActor(GetActorRequest) returns (Actor);
  rpc UpdateActor(UpdateActorRequest) returns (Actor);
  rpc ListActors(Empty) returns (ListActorsResponse);
}

service CharacterTraitService {
  rpc CreateTrait(CreateCharacterTraitRequest) returns (CharacterTrait);
  rpc GetTrait(GetCharacterTraitRequest) returns (CharacterTrait);
  rpc ListTraits(Empty) returns (ListCharacterTraitsResponse);
  rpc AssignTrait(AssignTraitRequest) returns (Empty);
  rpc UnassignTrait(UnassignTraitRequest) returns (Empty);
  rpc GetTraitAssignments(GetTraitAssignmentsRequest) returns (GetTraitAssignmentsResponse);
}

service CastingService {
  rpc CreateCasting(CreateCastingRequest) returns (Casting);
  rpc ListCastingForStory(ListCastingForStoryRequest) returns (ListCastingResponse);
  rpc ListCastingForActor(ListCastingForActorRequest) returns (ListCastingResponse);
  rpc ListCastingForCharacter(ListCastingForCharacterRequest) returns (ListCastingResponse);
}

service LocationService {
  rpc CreateLocation(CreateLocationRequest) returns (Location);
  rpc GetLocation(GetLocationRequest) returns (Location);
  rpc UpdateLocation(UpdateLocationRequest) returns (Location);
  rpc ListLocations(Empty) returns (ListLocationsResponse);
}

service LoreService {
  rpc CreateLore(CreateLoreRequest) returns (Lore);
  rpc ListLore(Empty) returns (ListLoreResponse);
  rpc SearchByTags(SearchLoreByTagsRequest) returns (ListLoreResponse);
  rpc SearchSimilar(SearchLoreSimilarRequest) returns (ListLoreResponse);
}
