syntax = "proto3";

package storybuilder.v1;

option go_package = "github.com/premchand/story-builder/internal/grpc/gen/storybuilder/v1;storybuilderv1";

import "storybuilder/v1/common.proto";
import "storybuilder/v1/graph.proto";

message GenerateStoryRequest {
  string synopsis = 1;
}

message GenerateStoryResponse {
  string story_id = 1;
  string status = 2;
}

service StoryGeneratorService {
  rpc GenerateStory(GenerateStoryRequest) returns (GenerateStoryResponse);
}
