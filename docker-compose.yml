services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: ["mongosh", "--host", "mongo:27017", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
  server:
    build: .
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: story_builder
      PORT: :8080
      AUTH_TOKEN: ${AUTH_TOKEN:?Set AUTH_TOKEN before starting Compose}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully

volumes:
  mongo-data:
