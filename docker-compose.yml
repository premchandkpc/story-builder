services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: storybuilder
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-storybuilder}
      MONGO_INITDB_DATABASE: storybuilder
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-storybuilder}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-storybuilder}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    ports:
      - "8787:8787"
    environment:
      HEADROOM_WORKSPACE_DIR: /data
    volumes:
      - headroomdata:/data
    command: ["headroom", "proxy", "--port", "8787", "--host", "0.0.0.0"]
    profiles:
      - headroom
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://storybuilder:${MONGO_PASSWORD:-storybuilder}@mongo:27017
      MONGO_DB: storybuilder
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-storybuilder}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENCODE_URL: ${OPENCODE_URL:-https://opencode.ai/zen}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-mimo-v2.5-free}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      HEADROOM_BASE_URL: ${HEADROOM_BASE_URL:-}
      HEADROOM_API_KEY: ${HEADROOM_API_KEY:-}
      NARRATIVE_ANALYSIS_URL: http://narrative-analysis:8081
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  narrative-analysis:
    build:
      context: ./services/narrative-analysis
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      MONGO_URI: mongodb://storybuilder:${MONGO_PASSWORD:-storybuilder}@mongo:27017/storybuilder
      MONGO_DB: storybuilder
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-storybuilder}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://server:8080
      VITE_HEADROOM_BASE_URL: ${HEADROOM_BASE_URL:-}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodata:
  headroomdata:
