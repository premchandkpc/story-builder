server.port=8081
spring.application.name=narrative-analysis

spring.data.mongodb.uri=${MONGO_URI:mongodb://storybuilder:storybuilder@localhost:27017/storybuilder}
spring.data.mongodb.database=${MONGO_DB:storybuilder}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:storybuilder}

management.endpoints.web.exposure.include=health,info
